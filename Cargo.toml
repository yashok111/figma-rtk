[package]
name = "figma-rtk"
version = "0.1.0"
edition = "2021"
description = "Token-killer reverse proxy for the Figma MCP server (RTK for Figma)"

[lib]
name = "figma_rtk"
path = "src/lib.rs"

[[bin]]
name = "frtk"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
dirs = "5"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
# Standard release hygiene for a shipped binary (no measured perf claim — frtk is
# I/O-bound, so these mainly affect CPU/binary-size, not upstream-dominated latency).
opt-level = 3
lto = "thin"
